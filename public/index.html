<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ドメモ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <p id="waking" class="hint">サーバーに接続中…（しばらく使われていないと1分ほどかかります）</p>
  <!-- トップ：部屋を作る／コードで入る -->
  <section id="home" class="screen hidden">
    <h1>ドメモ</h1>
    <p class="sub">自分の数字だけが見えない推理ゲーム（2〜5人）</p>
    <button id="createBtn" class="primary">部屋を作る</button>
    <p class="hint">作った部屋のリンクを友達に送れば一緒に遊べます</p>
    <form id="codeForm" class="card">
      <h2>部屋コードで入る</h2>
      <input id="codeInput" maxlength="8" placeholder="例：K7QX" autocomplete="off" autocapitalize="characters" required>
      <button type="submit" class="ghost">入る</button>
    </form>
  </section>

  <!-- 名前入力 -->
  <section id="join" class="screen hidden">
    <h1>ドメモ</h1>
    <p class="sub">部屋 <b id="joinRoom" class="mono"></b></p>
    <p id="joinNote" class="hint"></p>
    <form id="joinForm">
      <input id="nameInput" maxlength="12" placeholder="名前" autocomplete="off" required>
      <button type="submit" class="primary">参加する</button>
    </form>
    <button id="homeBtn" class="ghost">トップに戻る</button>
  </section>

  <!-- ロビー -->
  <section id="lobby" class="screen hidden">
    <h1>ロビー <span class="room-code mono" id="lobbyRoom"></span></h1>
    <div class="card">
      <h2>参加者 <span id="memberCount"></span></h2>
      <ul id="memberList"></ul>
    </div>
    <div class="card">
      <h2>1ターンに当てられる枚数</h2>
      <div id="limitPicker" class="seg">
        <button data-v="1">1枚</button><button data-v="2">2枚</button><button data-v="3">3枚</button><button data-v="0">無制限</button>
      </div>
      <p id="limitHint" class="hint"></p>
    </div>
    <div class="card">
      <h2>終了条件</h2>
      <div id="endPicker" class="seg seg2">
        <button data-v="last">最下位が決まるまで</button><button data-v="first">1位が出たら終了</button>
      </div>
      <h2 class="mt">宣言ログ</h2>
      <div id="logPicker" class="seg seg2">
        <button data-v="all">全部表示</button><button data-v="last">直前の1手番だけ</button>
      </div>
      <p id="logHint" class="hint"></p>
    </div>
    <button id="startBtn" class="primary">ゲーム開始</button>
    <p id="startHint" class="hint"></p>
    <div class="card qr">
      <p>このリンクかQRで友達を招待</p>
      <button id="shareBtn" class="primary">招待リンクを送る</button>
      <img id="qrImg" alt="参加用QRコード">
      <p id="joinUrl" class="mono"></p>
    </div>
    <button id="leaveBtn" class="ghost">退出する</button>
  </section>

  <!-- ゲーム -->
  <section id="game" class="screen hidden">
    <div id="banner" class="banner"></div>
    <div id="others"></div>
    <div class="card board">
      <div class="row-head">場の公開タイル</div>
      <div id="upTiles" class="tiles"></div>
      <div class="row-head">伏せタイル（誰にも見えない）</div>
      <div id="downTiles" class="tiles"></div>
    </div>
    <div class="card mine" id="mine">
      <div class="row-head">あなたのタイル</div>
      <div id="myTiles" class="tiles big"></div>
    </div>
    <div id="controls">
      <div id="numPad" class="numpad"></div>
      <button id="passBtn" class="ghost hidden">ここで手番を終える</button>
    </div>
    <div id="endControls" class="hidden">
      <button id="lobbyBtn" class="primary">ロビーに戻る</button>
    </div>
    <div id="ranking" class="card hidden">
      <h2>順位</h2>
      <ol id="rankList"></ol>
    </div>
    <details class="card log" open>
      <summary id="logSummary">宣言ログ</summary>
      <ul id="logList"></ul>
    </details>
  </section>

  <div id="toast" class="toast hidden"></div>
</main>
<script src="/socket.io/socket.io.js"></script>
<script src="client.js"></script>
</body>
</html>
